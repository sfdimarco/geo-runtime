# Visual lab: every creative hypothesis must survive the same build/fuzz/render path.
name: stubborn-circle experiment

on:
  push:
    branches:
      - experiment/stubborn-circle-01
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      - name: Rust unit tests
        run: cargo test
      - name: Build kernel
        run: ./build.sh
      - name: Run bounded fuzz gate
        run: node bench/fuzz.mjs
      - name: Render recovery sweep
        run: node experiments/stubborn-circle/sweep.mjs
      - name: Render overshoot sweep
        run: node experiments/stubborn-circle/overshoot-sweep.mjs
      - name: Render afterthought sweep
        run: node experiments/stubborn-circle/afterthought-sweep.mjs
      - name: Render pressure A/B
        run: node experiments/stubborn-circle/press-ab.mjs
      - name: Render memory A/B
        run: node experiments/stubborn-circle/memory-ab.mjs
      - name: Render spatial-choice A/B
        run: node experiments/stubborn-circle/dodge-ab.mjs
      - name: Render dodge timing sweep
        run: node experiments/stubborn-circle/dodge-timing-sweep.mjs
      - name: Render witness relationship A/B
        run: node experiments/stubborn-circle/witness-ab.mjs
      - name: Render reciprocity A/B
        run: node experiments/stubborn-circle/reciprocity-ab.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: stubborn-circle-lab
          path: |
            experiments/stubborn-circle/*.png
            experiments/stubborn-circle/*.gif
